<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studique</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0a0a0a;
      color: #fff;
      text-align: center;
    }
    .container { max-width: 400px; padding: 40px 20px; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { font-size: 16px; color: #999; line-height: 1.6; }
    .icon { font-size: 48px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon"></div>
    <h1 id="title"></h1>
    <p id="message"></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const flow = params.get('flow');

    if (flow === 'recovery') {
      document.getElementById('icon').textContent = '🔑';
      document.getElementById('title').textContent = 'Reset link opened';
      document.getElementById('message').textContent =
        'The reset link has been opened here. To set a new password, open the Studique app on your phone and follow the steps there.';
    } else {
      document.getElementById('icon').textContent = '✅';
      document.getElementById('title').textContent = 'Email verified!';
      document.getElementById('message').textContent =
        'Your email has been verified. You can close this page and return to the Studique app on your phone to continue.';
    }

    window.location.href = 'studique://auth-callback' + window.location.search;
  </script>
</body>
</html>
